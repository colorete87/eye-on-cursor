stages:
  - lint # Run ESLint
  - build # Pack the extension into a .zip
  - publish # Make a release with an asset published to the package registry and upload to EGO

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: registry.gitlab.gnome.org/gnome/gnome-shell/fedora/43:2025-11-28.0

variables:
  PACKAGE_NAME: '${CI_PROJECT_NAME}-extension-${CI_COMMIT_TAG}.zip'
  PACKAGE_REGISTRY_URL: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}'
  PACKAGE_URL: '${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/${PACKAGE_NAME}'

############ STAGE LINT ########################################################

eslint:
  stage: lint
  image: node:latest
  before_script:
    - npm ci
  script:
    - npx eslint --format gitlab
  artifacts:
    reports:
      codequality: gl-codequality.json
  rules:
    - changes: # if 'src' or the ESLint config changed
        - 'src/**/*'
        - 'eslint.config.*'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ # if there is a version tag

############ STAGE BUILD #######################################################

pack:
  stage: build
  script:
    - gnome-extensions pack ./src --force --extra-source="../LICENSE" --extra-source="./assets" --extra-source="./lib"
    - mv *.shell-extension.zip $PACKAGE_NAME
  artifacts:
    name: 'extension_zip_${CI_COMMIT_SHORT_SHA}'
    paths:
      - $PACKAGE_NAME
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ # if there is a version tag

############ STAGE PUBLISH #####################################################

package_upload:
  stage: publish
  image: curlimages/curl:latest
  script:
    - |
      curl --location --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file $PACKAGE_NAME $PACKAGE_URL
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ # if there is a version tag

gitlab_release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - package_upload
  script:
    - echo "Running the release job $CI_COMMIT_TAG."
  release:
    tag_name: $CI_COMMIT_TAG
    description: $CI_COMMIT_TAG_MESSAGE
    assets:
      links:
        - name: $PACKAGE_NAME
          url: $PACKAGE_URL
          direct_asset_path: '/${CI_PROJECT_NAME}-extension.zip'
          link_type: 'package'
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ # if there is a version tag

ego_upload:
  stage: publish
  script:
    - gnome-extensions upload $PACKAGE_NAME --accept-tos -u $EGO_USERNAME -p $EGO_PASSWORD
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ # if there is a version tag
